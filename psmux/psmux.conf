# ── General ───────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g display-time 3000
set -g status-interval 5
set -g set-clipboard on

# ── Numbering ─────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits & navigation ──────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with arrow keys
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Quick pane switching with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Quality of life ───────────────────────────────────────────
bind r source-file ~/.psmux.conf \; display "Config reloaded!"
bind x kill-pane
bind X kill-window

# ── Layout presets ────────────────────────────────────────────
# prefix + M-1 : Vertical split 50|50
bind M-1 new-window -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L

# prefix + M-2 : Horizontal split 50/50
bind M-2 new-window -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -U

# prefix + M-3 : Dev layout
bind M-3 new-window -c "#{pane_current_path}" \; \
  split-window -v -l 20% -c "#{pane_current_path}" \; \
  select-pane -U \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L

# ── Status bar (Catppuccin Mocha) ────────────────────────────
set -g status-position bottom
set -g status on
set -g status-style "bg=#181825,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#181825,fg=#cba6f7] "

# Right: date/time
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8]%a %b %d  #[fg=#b4befe,bold]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=#6c7086]  #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold]  #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#b4befe"

# Message / command prompt
set -g message-style "bg=#313244,fg=#fab387,bold"
