# ── General ───────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g display-time 3000
set -g status-interval 5
set -g set-clipboard on

# ── Numbering ─────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits & navigation ──────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with arrow keys
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Quick pane switching with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Quality of life ───────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind x kill-pane              # skip the confirmation prompt
bind X kill-window            # uppercase X for window

# ── Split ratio cycling (prefix + e) ─────────────────────────
# Cycles the current pane width: 40% → 50% → 60% → 40% ...
bind e run-shell ' \
  r=$(tmux show -wv @vratio 2>/dev/null); \
  case "$r" in \
    40) tmux resize-pane -x 50% ; tmux set -w @vratio 50 ; tmux display " 50 : 50" ;; \
    50) tmux resize-pane -x 60% ; tmux set -w @vratio 60 ; tmux display " 60 : 40" ;; \
    *)  tmux resize-pane -x 40% ; tmux set -w @vratio 40 ; tmux display " 40 : 60" ;; \
  esac'

# ── Layout presets ────────────────────────────────────────────
# prefix + M-1 : Vertical split 50|50
bind M-1 new-window -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L

# prefix + M-2 : Horizontal split 50/50
bind M-2 new-window -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -U

# prefix + M-3 : Dev layout — two vertical panes (top 80%) + horizontal (bottom 20%)
# ┌───────┬───────┐
# │       │       │  80%
# ├───────┴───────┤
# │               │  20%
# └───────────────┘
bind M-3 new-window -c "#{pane_current_path}" \; \
  split-window -v -l 20% -c "#{pane_current_path}" \; \
  select-pane -U \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -L

# prefix + L : Layout picker menu (native tmux commands, no run-shell)
bind L display-menu -T " Layouts" -x C -y S \
  "│ Vertical 50|50"   1 "new-window -c '#{pane_current_path}' ; split-window -h -c '#{pane_current_path}' ; select-pane -L" \
  "─ Horizontal 50/50" 2 "new-window -c '#{pane_current_path}' ; split-window -v -c '#{pane_current_path}' ; select-pane -U" \
  "┬ Dev VV+H (80:20)" 3 "new-window -c '#{pane_current_path}' ; split-window -v -l 20% -c '#{pane_current_path}' ; select-pane -U ; split-window -h -c '#{pane_current_path}' ; select-pane -L"

# ── Catppuccin palette (Mocha) ────────────────────────────────
crust="#11111b"
mantle="#181825"
base="#1e1e2e"
surface0="#313244"
surface1="#45475a"
overlay0="#6c7086"
text="#cdd6f4"
subtext0="#a6adc8"
lavender="#b4befe"
blue="#89b4fa"
green="#a6e3a1"
peach="#fab387"
pink="#f5c2e7"
mauve="#cba6f7"

# ── Status bar ────────────────────────────────────────────────
set -g status-position bottom
set -g status 2                 # two-line status bar (tmux 3.3+)
set -g status-style "bg=$mantle,fg=$text"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=$mauve,fg=$crust,bold]  #S #[bg=$mantle,fg=$mauve] "

# Right: git branch + date/time
set -g status-right-length 80
set -g status-right "#[fg=$overlay0]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/^/ /')  #[fg=$subtext0]%a %b %d  #[fg=$lavender,bold]%H:%M "

# Window tabs
setw -g window-status-format "#[fg=$overlay0]  #I:#W "
setw -g window-status-current-format "#[bg=$surface0,fg=$blue,bold]  #I:#W "
setw -g window-status-separator ""

# ── Zellij-style keybinding hint bar (line 2) ────────────────
set -g status-format[1] "#[bg=#313244,fg=#cdd6f4,none] #[fg=#a6e3a1,bold]C-b |#[fg=#a6adc8,none] Split H  #[fg=#a6e3a1,bold]C-b -#[fg=#a6adc8,none] Split V  #[fg=#89b4fa,bold]Alt+Arrows#[fg=#a6adc8,none] Panes  #[fg=#fab387,bold]C-b e#[fg=#a6adc8,none] Ratio  #[fg=#f5c2e7,bold]C-b L#[fg=#a6adc8,none] Layouts  #[fg=#cba6f7,bold]C-b z#[fg=#a6adc8,none] Zoom  #[fg=#b4befe,bold]C-b [#[fg=#a6adc8,none] Scroll  #[fg=#f38ba8,bold]C-b x#[fg=#a6adc8,none] Pane  #[fg=#f38ba8,bold]C-b X#[fg=#a6adc8,none] Window  #[fg=#a6e3a1,bold]C-b c#[fg=#a6adc8,none] New Win  #[fg=#a6e3a1,bold]C-b d#[fg=#a6adc8,none] Detach  #[fg=#6c7086]│ #[fg=#89b4fa,bold]C-b h#[fg=#6c7086,none] Toggle"

# Toggle the hint bar on/off with prefix + h
bind h if-shell '[ "$(tmux show -gv status)" = "2" ]' \
  'set -g status 1 ; display "Hints hidden"' \
  'set -g status 2 ; display "Hints shown"'

# Pane borders
set -g pane-border-style "fg=$surface1"
set -g pane-active-border-style "fg=$lavender"

# Message / command prompt
set -g message-style "bg=$surface0,fg=$peach,bold"

